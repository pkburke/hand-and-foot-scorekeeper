<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Hand and Foot HF monogram">
 <defs>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2edf5"/><stop offset="1" stop-color="#bed0df"/></linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="0.85" y2="1"><stop stop-color="#07779a"/><stop offset="1" stop-color="#003c62"/></linearGradient>
